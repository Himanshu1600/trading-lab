auth.jwt-signing-key=test-only-signing-key-at-least-32-characters
# Tests never call the real Alpaca API, even if .env has keys.
alpaca.api-key-id=
alpaca.api-secret-key=
# Tests run the matching engine by hand, so results don't depend on timing.
trading.matching-interval=1h
trading.ignore-market-hours=false
# Tests never call a real ai-service, even if .env sets a token.
ai.service-token=
# Tests sign up many users from one address; RateLimitTests sets its own low limits.
rate-limit.auth=100000
rate-limit.orders=100000
rate-limit.backtests=100000
rate-limit.ai=100000
# Tests run without Kafka; KafkaFlowTests starts its own broker and turns these back on.
spring.modulith.events.externalization.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
