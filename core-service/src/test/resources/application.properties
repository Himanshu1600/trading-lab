auth.jwt-signing-key=test-only-signing-key-at-least-32-characters
# Tests never call the real Alpaca API, even if .env has keys.
alpaca.api-key-id=
alpaca.api-secret-key=
# Tests run the matching engine by hand, so results don't depend on timing.
trading.matching-interval=1h
trading.ignore-market-hours=false
