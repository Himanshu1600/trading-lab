name: core

on:
  push:
    branches: [main]
    paths: ["core-service/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core-service/**", ".github/workflows/core.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Invoked through sh because Windows checkouts may not keep the executable bit.
      - run: sh ./mvnw -B verify
