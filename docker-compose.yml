# Local infrastructure. Run the services themselves from their own folders (see README.md).
services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17.11-ts2.31.0
    # Comes back by itself after Docker Desktop restarts, unless you stopped it.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradinglab}
      POSTGRES_USER: ${POSTGRES_USER:-tradinglab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradinglab}
    ports:
      # 5433 on the host so it doesn't clash with a local PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - timescale-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka-compatible broker, lighter than Kafka itself. core-service connects on localhost:19092.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Clients inside Docker use redpanda:9092; programs on your PC use localhost:19092.
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Optional monitoring: docker compose --profile observability up -d
  # Prometheus reads core-service's metrics on your PC; Grafana shows them at http://localhost:3001.
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.2.1
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  timescale-data:
  redis-data:
  redpanda-data:
  prometheus-data:
